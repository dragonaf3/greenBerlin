<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Berlin</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script defer async src="js/javascript.js"></script>
</head>
<body class="bg-light">

<!-- Header -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-4">
            <header class="mt-1">
                <h1 class="card-title text-center text-success">Green Berlin</h1>
            </header>
        </div>
    </div>
</div>
<!-- Header Ende -->

<!-- Login-Screen -->
<div class="container mt-5" id="login-screen">
    <div class="row justify-content-center">
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title text-center fs-4">Login</h1>
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username:</label>
                            <input type="text" id="username" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Login-Screen Ende -->

<!-- Main-Screen -->
<div class="container mt-5 d-none" id="main-screen">
    <h2 class="mb-3" id="welcome-message">Welcome, [username]!</h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-success">
            <tr>
                <th>Name/Title</th>
                <th>Description</th>
                <th>Street and Number</th>
                <th>ZIP</th>
                <th>City</th>
                <th>Category</th>
                <th>Image</th>
            </tr>
            </thead>

            <tbody id="tableBody">
            <!-- Hier werden die Standorte als Tabellenzeilen dynamisch hinzugefügt -->
            </tbody>
        </table>
    </div>

    <button class="btn btn-success" id="add-button">Add</button>
    <button class="btn btn-danger" id="logout-button">Logout</button>
</div>

<!-- Add-Screen -->
<div class="container mt-5 d-none" id="add-screen">

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">

                <div class="card-header">
                    <h1>Add Location</h1>
                </div>

                <div class="card-body">
                    <form id="add-form">
                        <div class="mb-2">
                            <label for="location-name" class="form-label">Name/Title:</label>
                            <input type="text" id="location-name" name="location-name" class="form-control"
                                   required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-description" class="form-label">Description:</label>
                            <textarea id="location-description" name="location-description" class="form-control"
                                      rows="4"
                                      required></textarea><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-street" class="form-label">Street and Number:</label>
                            <input type="text" id="location-street" name="location-street" class="form-control"
                                   required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-zip" class="form-label">ZIP:</label>
                            <input type="text" id="location-zip" name="location-zip" class="form-control"
                                   required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-city" class="form-label">City:</label>
                            <input type="text" id="location-city" name="location-city" class="form-control"
                                   required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-category" class="form-label">Category:</label>
                            <select id="location-category" name="location category" class="form-control" required>
                                <option value="" disabled selected>Select an option</option>
                                <option value="Bike/Cyclists">Bike/Cyclists</option>
                                <option value="Pedestrians">Pedestrians</option>
                                <option value="Public Transportation">Public Transportation</option>
                                <option value="Cars/Car-Infrastructure">Cars/Car-Infrastructure</option>
                                <option value="Industry">Industry</option>
                                <option value="Parks & Rec.">Parks & Rec.</option>
                                <option value="other">other</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label for="location-temporary" class="form-label">Temporary:</label>
                            <input type="checkbox" id="location-temporary" name="location-temporary"
                                   value="temporary"><br>
                        </div>
                        <div class="mb-2">
                            <input type="file" id="location-image" name="location-image" class="form-control"><br>
                        </div>
                        <button type="submit" class="btn btn-success" id="submit-button-add">Save/Submit</button>
                        <button type="button" class="btn btn-secondary" id="cancel-button-add">Cancel</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
<!-- Add-Screen Ende -->

<!-- Detail Screen -->
<div class="container mt-5 d-none" id="detail-screen">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">

                <div class="card-header">
                    <h1>Details</h1>
                </div>

                <div class="card-body">
                    <form id="detail-form">
                        <div class="mb-2">
                            <label for="location-name-edit" class="form-label">Name/Title:</label>
                            <input type="text" id="location-name-edit" name="location-name" class="form-control"
                                   value="Berghain" required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-description-edit" class="form-label">Description:</label>
                            <textarea id="location-description-edit" name="location-description" class="form-control"
                                      rows="4"
                                      required>Consumption of party drugs leads to a lower tap water quality.</textarea><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-street-edit" class="form-label">Street and Number:</label>
                            <input type="text" id="location-street-edit" name="location-street" class="form-control"
                                   value="Ruedersdorferstr. 7" required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-zip-edit" class="form-label">ZIP:</label>
                            <input type="text" id="location-zip-edit" name="location-zip" class="form-control"
                                   value="10243" required><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-city-edit" class="form-label">City:</label>
                            <input type="text" id="location-city-edit" name="location-city" class="form-control"
                                   value="Berlin" required><br>
                        </div>
                        <div class="mb-2">
                            <label for="longID" class="form-label">Longitude:</label>
                            <input type="text" name="longitude" id="longID" class="form-control" readonly>
                        </div>
                        <div class="mb-2">
                            <label for="latID" class="form-label">Latitude:</label>
                            <input type="text" name="latitude" id="latID" class="form-control" readonly>
                        </div>
                        <div class="mb-2">
                            <label for="location-category-edit" class="form-label">Category:</label>
                            <select id="location-category-edit" name="location category" class="form-control" required>
                                <option value="" disabled selected>Select an option</option>
                                <option value="Bike/Cyclists">Bike/Cyclists</option>
                                <option value="Pedestrians">Pedestrians</option>
                                <option value="Public Transportation">Public Transportation</option>
                                <option value="Cars/Car-Infrastructure">Cars/Car-Infrastructure</option>
                                <option value="Industry">Industry</option>
                                <option value="Parks & Rec.">Parks & Rec.</option>
                                <option value="other">other</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label for="location-temporary-edit" class="form-label">Temporary:</label>
                            <input type="checkbox" id="location-temporary-edit" name="location-temporary"
                                   value="temporary"><br>
                        </div>
                        <div class="mb-2">
                            <label for="location-image-edit" class="form-label">Current Image:</label>
                            <img src="images/example.jpeg" alt="Location Image" class="img-fluid img-thumbnail mb-3" id="currentImage">
                            <input type="file" id="location-image-edit" name="location-image" class="form-control"><br>
                        </div>
                        <button type="submit" class="btn btn-success" id="update-button-detail">Update</button>
                        <button type="button" class="btn btn-danger" id="delete-button-detail">Delete</button>
                        <button type="button" class="btn btn-secondary" id="cancel-button-detail">Cancel</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
<!-- Detail Screen Ende -->

<!-- Footer -->
<div class="container mb-4">
    <div class="row justify-content-left">
        <div class="col-lg-4">
            <footer class="mt-4">
                <a href="#">Impressum</a> | <a href="#">Privacy policy</a>
            </footer>
        </div>
    </div>
</div>
<!-- Footer Ende -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
